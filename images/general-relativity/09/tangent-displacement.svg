<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Two components of one tangent displacement</title>
  <desc id="desc">Left: a tangent plane touches a unit sphere at P, perpendicular to the radial direction OP. Right: a face-on view of the tangent plane resolves one infinitesimal displacement into horizontal xi and vertical eta components.</desc>
  <defs>
    <marker id="gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#64748b"/></marker>
    <marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="960" height="420" rx="16" fill="#f8fafc"/>
  <path d="M435 55V365" stroke="#cbd5e1"/>
  <g font-family="sans-serif" font-size="18" fill="#0f172a">
    <text x="30" y="35" font-size="22">At a point on the unit sphere</text>
    <circle cx="210" cy="250" r="110" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/>
    <ellipse cx="210" cy="250" rx="110" ry="30" fill="none" stroke="#94a3b8" stroke-dasharray="6 5"/>
    <path d="M75 165L295 165L345 115L125 115Z" fill="#ccfbf1" fill-opacity=".75" stroke="#0f766e" stroke-width="2"/>
    <path d="M210 250V75" stroke="#64748b" stroke-width="2" marker-end="url(#gray)"/>
    <circle cx="210" cy="250" r="4" fill="#475569"/>
    <circle cx="210" cy="140" r="5" fill="#2563eb"/>
    <text x="188" y="275">O</text>
    <text x="221" y="134" fill="#2563eb">P</text>
    <text x="224" y="84">Radial direction</text>
    <text x="45" y="195" fill="#0f766e">Tangent plane</text>
    <text x="135" y="390">Unit sphere</text>
    <text x="470" y="35" font-size="22">One displacement, two components</text>
    <rect x="505" y="75" width="390" height="275" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
    <g stroke="#64748b" stroke-width="2" marker-end="url(#gray)">
      <path d="M580 290H865"/><path d="M580 290V100"/>
    </g>
    <path d="M580 290L790 145" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)"/>
    <path d="M580 145H790V290" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="M580 276H594V290" fill="none" stroke="#64748b"/>
    <circle cx="580" cy="290" r="5" fill="#2563eb"/>
    <text x="554" y="316" fill="#2563eb">P</text>
    <text x="680" y="316" fill="#0f766e">ξ</text>
    <text x="550" y="220" fill="#0f766e">η</text>
    <text x="653" y="118" fill="#2563eb">Displacement</text>
    <text x="550" y="390">Tangent plane viewed face-on</text>
  </g>
</svg>
