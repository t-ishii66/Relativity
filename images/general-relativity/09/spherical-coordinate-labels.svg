<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">A sphere label and two angles</title>
  <desc id="desc">Left: nested spherical shells labelled u1, u2 and u3, shown in cross section. Right: theta is measured from the north axis to OP; phi is measured in the equatorial plane from the reference direction to the projection of OP.</desc>
  <defs>
    <marker id="axis" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
    <marker id="angle" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#0f766e"/></marker>
  </defs>
  <rect width="960" height="420" rx="16" fill="#f8fafc"/>
  <path d="M430 55V370" stroke="#cbd5e1"/>
  <g font-family="sans-serif" fill="#0f172a" font-size="18">
    <text x="35" y="35" font-size="22">1. Choose a sphere: u</text>
    <g fill="none" stroke-width="2">
      <circle cx="195" cy="215" r="135" stroke="#94a3b8"/>
      <circle cx="195" cy="215" r="95" stroke="#2563eb" stroke-width="4"/>
      <circle cx="195" cy="215" r="52" stroke="#94a3b8"/>
    </g>
    <circle cx="195" cy="215" r="5" fill="#475569"/>
    <text x="173" y="242">O</text>
    <g stroke="#64748b" fill="none">
      <path d="M232 178L325 125"/><path d="M262 148L325 95"/><path d="M290 120L325 65"/>
    </g>
    <text x="337" y="130">u₁</text>
    <text x="337" y="100" fill="#2563eb">u₂</text>
    <text x="337" y="70">u₃</text>
    <text x="82" y="385">Shell labels, not distances</text>
    <text x="465" y="35" font-size="22">2. Choose a position: θ, φ</text>
    <ellipse cx="665" cy="245" rx="175" ry="65" fill="#dbeafe" fill-opacity=".45" stroke="#94a3b8"/>
    <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#axis)">
      <path d="M665 245V65"/><path d="M665 245L530 310"/>
    </g>
    <text x="678" y="77">North</text>
    <text x="465" y="332">Reference</text>
    <path d="M665 245L780 130" stroke="#2563eb" stroke-width="3"/>
    <path d="M780 130V285L665 245" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="M665 183Q690 186 709 201" fill="none" stroke="#b45309" stroke-width="3"/>
    <text x="690" y="183" fill="#b45309">θ</text>
    <path d="M625 264Q665 290 706 259" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#angle)"/>
    <text x="660" y="301" fill="#0f766e">φ</text>
    <circle cx="665" cy="245" r="5" fill="#475569"/>
    <circle cx="780" cy="130" r="6" fill="#2563eb"/>
    <circle cx="780" cy="285" r="4" fill="#64748b"/>
    <text x="642" y="266">O</text>
    <text x="793" y="125" fill="#2563eb">P</text>
    <text x="690" y="345">Equatorial plane</text>
    <text x="545" y="385">P is specified by (u, θ, φ)</text>
  </g>
</svg>
