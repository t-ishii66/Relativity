<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">A quarter turn in the tangent plane</title>
  <desc id="desc">With the axes fixed, a displacement with positive components xi and eta rotates counterclockwise by 90 degrees. Its new horizontal component is minus eta and its new vertical component is xi. Both panels use the same scale.</desc>
  <defs>
    <marker id="axis" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#64748b"/></marker>
    <marker id="vector" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="960" height="400" rx="16" fill="#f8fafc"/>
  <g font-family="sans-serif" font-size="19" fill="#0f172a">
    <text x="110" y="35" font-size="22">Before rotation</text>
    <text x="605" y="35" font-size="22">After a 90° rotation</text>
    <g fill="#f0fdfa" stroke="#99f6e4">
      <rect x="45" y="65" width="350" height="270" rx="10"/>
      <rect x="555" y="65" width="350" height="270" rx="10"/>
    </g>
    <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#axis)">
      <path d="M75 270H370"/><path d="M155 305V85"/>
      <path d="M580 270H880"/><path d="M755 305V85"/>
    </g>
    <g fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 5">
      <path d="M155 180H285V270"/>
      <path d="M665 270V140H755"/>
    </g>
    <g stroke="#2563eb" stroke-width="4" marker-end="url(#vector)">
      <path d="M155 270L285 180"/>
      <path d="M755 270L665 140"/>
    </g>
    <g fill="#2563eb">
      <circle cx="155" cy="270" r="4"/><circle cx="755" cy="270" r="4"/>
    </g>
    <text x="133" y="295">P</text><text x="762" y="295">P</text>
    <g fill="#0f766e">
      <text x="215" y="297">ξ</text><text x="128" y="229">η</text>
      <text x="697" y="297">−η</text><text x="769" y="211">ξ</text>
    </g>
    <path d="M425 210H520" stroke="#64748b" stroke-width="2" marker-end="url(#axis)"/>
    <text x="445" y="193">90°</text>
    <text x="115" y="370">(ξ, η)</text>
    <text x="675" y="370">(−η, ξ)</text>
  </g>
</svg>
