<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="-120 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">Two light paths</title>
  <desc id="desc">A star lies to the left of two stationary mirrors with a light source and Alice's clock between them. Light travels out and back along each arm. The left mirror is closer to the star, where gravity is stronger; the right mirror is farther away.</desc>
  <defs>
    <radialGradient id="star">
      <stop offset="0" stop-color="#fff8c4"/>
      <stop offset=".65" stop-color="#ffd05c"/>
      <stop offset="1" stop-color="#ed8e24"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="context-stroke"/>
    </marker>
    <linearGradient id="mirror" x1="0" x2="1">
      <stop offset="0" stop-color="#b8d5e8"/>
      <stop offset=".5" stop-color="#f3fbff"/>
      <stop offset="1" stop-color="#91b4cb"/>
    </linearGradient>
  </defs>
  <rect x="-120" width="1120" height="360" rx="20" fill="#f7fafc"/>
  <g stroke="#edaa35" stroke-width="3" stroke-linecap="round">
    <path d="M-55 139V131M-55 247V255M-109 193H-117M-1 193H7M-93 155L-99 149M-17 231L-11 237M-93 231L-99 237M-17 155L-11 149"/>
  </g>
  <circle cx="-55" cy="193" r="40" fill="url(#star)" stroke="#d98520" stroke-width="2"/>
  <text x="-55" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#805019">Star</text>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g fill="#40546b" font-size="20">
      <text x="225" y="40">Closer to the star</text>
      <text x="775" y="40">Farther from the star</text>
    </g>
    <g stroke="#71869c" stroke-width="2" marker-end="url(#arrow)">
      <path d="M355 60H95"/>
      <path d="M645 60H905"/>
    </g>
    <g fill="#172e48" font-size="22" font-weight="bold">
      <text x="130" y="110">Left mirror</text>
      <text x="500" y="110">Light source</text>
      <text x="870" y="110">Right mirror</text>
    </g>
    <g fill="url(#mirror)" stroke="#557b96" stroke-width="2">
      <rect x="119" y="145" width="22" height="96" rx="4"/>
      <rect x="859" y="145" width="22" height="96" rx="4"/>
    </g>
    <g stroke-width="4" fill="none" marker-end="url(#arrow)">
      <path d="M461 170H149" stroke="#d18a16"/>
      <path d="M149 216H461" stroke="#2584ac"/>
      <path d="M539 170H851" stroke="#d18a16"/>
      <path d="M851 216H539" stroke="#2584ac"/>
    </g>
    <circle cx="500" cy="170" r="21" fill="#ffd56a" stroke="#bf7b11" stroke-width="2"/>
    <g stroke="#d18a16" stroke-width="2">
      <path d="M500 137V129M500 203V211M467 170H459M533 170H541"/>
    </g>
    <circle cx="500" cy="237" r="23" fill="white" stroke="#40546b" stroke-width="2"/>
    <path d="M500 221V237L512 243" fill="none" stroke="#40546b" stroke-width="3" stroke-linecap="round"/>
    <g fill="#40546b" font-size="17">
      <text x="500" y="285">Alice's clock</text>
      <text x="300" y="154">Outgoing</text>
      <text x="700" y="154">Outgoing</text>
      <text x="300" y="245">Returning</text>
      <text x="700" y="245">Returning</text>
    </g>
    <g fill="#172e48" font-family="Georgia, serif" font-size="23">
      <text x="130" y="318">r<tspan baseline-shift="sub" font-size="16">−</tspan></text>
      <text x="500" y="318">r<tspan baseline-shift="sub" font-size="16">A</tspan></text>
      <text x="870" y="318">r<tspan baseline-shift="sub" font-size="16">+</tspan></text>
    </g>
    <text x="500" y="346" fill="#62758a" font-size="14">Schematic — not to scale. Outgoing and returning paths are separated for clarity.</text>
  </g>
</svg>
